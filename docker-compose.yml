# Phase-0 stack: FastAPI agent + Postgres on the CPU VM (orchestrator only).
# Ollama runs from repo **ai-model** (`deploy-ollama`, `-p ai_model_ollama`) — same host.
# Agent joins Ollama's default network as external **ai_model_ollama_default** (exists after deploy-ollama).
# Default OLLAMA_HOST is http://ollama:11434 (Compose service name on that network).
#
# Deploy: scripts/deploy-agent.sh on a host (or CI runner) with Docker + Compose v2.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sre_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build: .
    ports:
      - "${AGENT_PORT:-8080}:8080"
    networks:
      - default
      - ai_model_ollama_default
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-sre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sre_agent}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_RCA_ENABLED: ${OLLAMA_RCA_ENABLED:-true}
      # Optional decoding controls for POST /api/chat — omit in .env to use Ollama defaults.
      OLLAMA_RCA_TEMPERATURE: ${OLLAMA_RCA_TEMPERATURE:-}
      OLLAMA_RCA_TOP_P: ${OLLAMA_RCA_TOP_P:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      OLLAMA_RCA_MAX_LOG_CHARS: ${OLLAMA_RCA_MAX_LOG_CHARS:-12000}
      OLLAMA_HEALTH_TIMEOUT_SECONDS: ${OLLAMA_HEALTH_TIMEOUT_SECONDS:-5}
      OLLAMA_HEALTH_REQUIRE_MODEL: ${OLLAMA_HEALTH_REQUIRE_MODEL:-true}
      LOKI_URL_PROD: ${LOKI_URL_PROD:-}
      LOKI_URL_NONPROD: ${LOKI_URL_NONPROD:-}
      LOKI_URL_DEFAULT: ${LOKI_URL_DEFAULT:-}
      LOKI_BEARER_TOKEN: ${LOKI_BEARER_TOKEN:-}
      LOKI_SCOPE_ORG_ID: ${LOKI_SCOPE_ORG_ID:-}
      LOKI_ENRICH_ENABLED: ${LOKI_ENRICH_ENABLED:-true}
      LOKI_ENRICH_WINDOW_MINUTES: ${LOKI_ENRICH_WINDOW_MINUTES:-10}
      LOKI_ENRICH_ANCHOR: ${LOKI_ENRICH_ANCHOR:-alert_start}
      LOKI_QUERY_DIRECTION: ${LOKI_QUERY_DIRECTION:-backward}
      LOKI_ENRICH_PRIORITIZE_STARTS_AT: ${LOKI_ENRICH_PRIORITIZE_STARTS_AT:-true}
      LOKI_ENRICH_STRATIFY_LINES: ${LOKI_ENRICH_STRATIFY_LINES:-true}
      LOKI_ENRICH_ERROR_PASS_ENABLED: ${LOKI_ENRICH_ERROR_PASS_ENABLED:-true}
      LOKI_QUERY_LIMIT: ${LOKI_QUERY_LIMIT:-500}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_NOTIFY_ENABLED: ${SLACK_NOTIFY_ENABLED:-true}
      SLACK_SMART_SKIP_OPERATOR_CHECKLIST: ${SLACK_SMART_SKIP_OPERATOR_CHECKLIST:-true}
      SLACK_TIMEOUT_SECONDS: ${SLACK_TIMEOUT_SECONDS:-10}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  ai_model_ollama_default:
    external: true
    name: ai_model_ollama_default

volumes:
  postgres_data:
    # Keep historical data from earlier default "build" compose project.
    name: build_postgres_data
